<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>SISCOM ERP</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f9fafb;
      background: #111827;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 1100px); }
    h1 { margin: 0 0 16px; font-size: clamp(1.5rem, 4vw, 2.25rem); }
    video {
      display: block;
      width: 100%;
      max-height: 80vh;
      background: #000;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Demo SISCOM ERP</h1>
    <video controls playsinline preload="metadata">
      <source src="siscom_erp.mp4" type="video/mp4">
      Browser Anda tidak mendukung pemutar video HTML5.
      <a href="siscom_erp.mp4">Unduh video</a>.
    </video>
  </main>
</body>
</html>
